name: Release

# Release-please keeps an open "chore(main): release x.y.z" PR that accumulates
# the version bump and CHANGELOG from conventional commits on main. Merging that
# PR creates the tag and the GitHub Release, and the publish jobs below run.
#
# The publish jobs live in THIS workflow rather than relying on npmpublish.yml's
# `on: release` trigger: a release created by a workflow using the default
# GITHUB_TOKEN does not trigger other workflows, so that trigger would never
# fire. npmpublish.yml is retained for releases created by hand in the UI.

on:
  push:
    branches:
      - main
  # Lets a release run be re-triggered without landing an unrelated commit.
  # The push trigger is the normal path, but a run that fails transiently
  # (a GitHub incident, a startup_failure that cannot be retried) would
  # otherwise be stranded until the next merge happens to come along.
  workflow_dispatch:
    inputs:
      publish_tag:
        description: >-
          Publish an existing tag to npm (e.g. v1.3.12). Use when the tag and
          GitHub Release already exist but the npm publish failed. Leave blank
          for a normal release run.
        required: false
        default: ''

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || inputs.publish_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.publish_tag || needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # npm advises against caching in release builds

      - run: npm ci
      - run: npm test

      # Authentication is npm trusted publishing (OIDC), configured against this
      # repository and this workflow filename on npmjs.com. Deliberately no
      # NODE_AUTH_TOKEN: setup-node writes `_authToken=${NODE_AUTH_TOKEN}` into
      # .npmrc, so passing an empty secret leaves an empty token there, and npm
      # then treats auth as configured, skips the OIDC exchange, and fails with
      # ENEEDAUTH. Provenance is generated automatically under trusted
      # publishing, so --provenance is not needed either.
      - run: npm publish

  publish-gpr:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: https://npm.pkg.github.com/
          scope: '@drewsonne'
          cache: 'npm'

      - run: npm ci
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
